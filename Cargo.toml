[workspace]
resolver = "3"
members = [
  "crates/pq-meter-client",
  "crates/pq-meter-server",
  "crates/umg605-modbus-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Anapaya/secure-pq-meter-template"

[workspace.dependencies]
# Local crates
umg605-modbus-client = { path = "crates/umg605-modbus-client" }

# SCION endhost SDK (https://github.com/Anapaya/scion-sdk).
# All SDK crates are released together, so they are pinned to one exact version.
pocketscion = "=0.7.0"
scion-h3-axum = "=0.7.0"
scion-http3 = "=0.7.0"
scion-quic = "=0.7.0"
scion-sdk-utils = "=0.7.0"
scion-stack = "=0.7.0"
sciparse = "=0.7.0"
snap-tokens = "=0.7.0"

# General dependencies.
anyhow = "1"
axum = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-modbus = { version = "0.17", features = ["tcp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
