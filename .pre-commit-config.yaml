# Git hooks, run by the Python `pre-commit` framework (https://pre-commit.com).
#
# Install them once per clone with `make hooks`; see the README section "Git hooks and
# CI". The same hooks run in CI over every file, so a clean commit here is a green
# pipeline there.

# Everything here runs at commit time; nothing is deferred to a push.
default_stages: [pre-commit]

repos:
  # File hygiene: no trailing whitespace, LF line endings only, a newline at the end of
  # every file.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These two ask upstream to run on push as well, which `default_stages` does not
      # override, so they are pinned back to commit time explicitly.
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  # The Rust hooks call the toolchain pinned in rust-toolchain.toml directly, rather than
  # letting pre-commit build an environment of its own: that is what `language: system`
  # means. They check the whole workspace, so they do not take the changed files.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # The suite runs in well under a second once the workspace is built, which is the
      # same cold/warm profile clippy above already has. No reason to defer it to a push.
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
